[tool.poetry]
name = "romo-info"
version = "0.1.0"
description = "Publishes a daily Rømø tide, weather, and amber-hunting page to GitHub Pages."
authors = ["Jannis Baur"]
license = "MIT"
readme = "README.md"
packages = [{ include = "romo_info", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
httpx = "^0.28"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
respx = "^0.22"
ruff = "^0.8"
mypy = "^1.13"

[tool.poetry.scripts]
romo-info = "romo_info.__main__:main"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "C4", "RUF", "N", "PTH"]
ignore = [
  "PLR0913", # constructors doing dependency injection legitimately take several args
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # assert is expected in tests

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
