name: Daily Rømø report

on:
  schedule:
    # 05:00 UTC = ~06:00-07:00 in Europe/Copenhagen depending on DST.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

# Deploying to Pages needs these on the default GITHUB_TOKEN -- no
# personal token or stored secret is involved anywhere in this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let a scheduled run and a manual run deploy over each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --only main

      - name: Build report page
        env:
          # Today + tomorrow. The storm outlook's lookahead window starts
          # after the last reported day, so it shifts along with this.
          DAYS_TO_REPORT: "2"
        run: poetry run python -m romo_info

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
