name: Daily Rømø report

on:
  schedule:
    # 04:00 UTC = 06:00 in Europe/Copenhagen during summer time (CEST,
    # UTC+2). GitHub Actions cron is fixed UTC with no DST awareness, so
    # this needs bumping to "0 5 * * *" once Denmark switches back to
    # winter time (CET, UTC+1) -- usually the last Sunday in October.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --only main

      - name: Decrypt WhatsApp session
        env:
          SESSION_PASSPHRASE: ${{ secrets.WHATSAPP_SESSION_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in data/session.db.enc -out data/session.db \
            -pass env:SESSION_PASSPHRASE

      - name: Send report
        env:
          WHATSAPP_GROUP_JID: ${{ secrets.WHATSAPP_GROUP_JID }}
          SESSION_DB_PATH: data/session.db
        run: poetry run python -m romo_bot
